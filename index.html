<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品管理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
header{background:#fff;border-bottom:0.5px solid #ddd;padding:0 1.5rem;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header h1{font-size:17px;font-weight:500}
main{max-width:960px;margin:0 auto;padding:1.5rem}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.toolbar input,.toolbar select{height:36px;font-size:14px;border:0.5px solid #ccc;border-radius:8px;padding:0 10px;background:#fff;color:#1a1a1a;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:#7F77DD}
.toolbar input{flex:1;min-width:140px}
.toolbar select{min-width:120px}
.btn{height:36px;padding:0 14px;border:0.5px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f5f5f5}
.btn-primary{background:#7F77DD;border-color:#7F77DD;color:#fff}
.btn-primary:hover{background:#534AB7;border-color:#534AB7}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:1rem}
.stat-card{background:#fff;border:0.5px solid #e5e5e5;border-radius:8px;padding:0.75rem 1rem}
.stat-card .label{font-size:12px;color:#888;margin-bottom:4px}
.stat-card .value{font-size:22px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:#fff;border:0.5px solid #e5e5e5;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color 0.15s,box-shadow 0.15s}
.card:hover{border-color:#aaa;box-shadow:0 2px 8px rgba(0,0,0,0.07)}
.card-img{width:100%;aspect-ratio:1;overflow:hidden;background:#f5f5f0;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:13px;flex-direction:column;gap:6px;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-img-count{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.5);color:#fff;font-size:11px;padding:2px 6px;border-radius:10px}
.card-body{padding:10px 12px}
.card-title{font-size:14px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:12px;color:#888;margin-bottom:6px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.badge{font-size:11px;padding:2px 7px;border-radius:10px;font-weight:500}
.badge-sold{background:#FAECE7;color:#993C1D}
.badge-stock{background:#EAF3DE;color:#3B6D11}
.badge-hold{background:#FAEEDA;color:#854F0B}
.badge-platform{background:#EEEDFE;color:#534AB7}
.badge-sns{background:#E1F5EE;color:#0F6E56}
.card-price{font-size:15px;font-weight:500}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;align-items:center;justify-content:center;padding:1rem}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;border:0.5px solid #ddd;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;padding:1.25rem}
.modal h2{font-size:17px;font-weight:500;margin-bottom:1rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-row.full{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:12px;color:#666}
.form-group input,.form-group select,.form-group textarea{font-size:14px;border:0.5px solid #ccc;border-radius:8px;padding:7px 10px;background:#fff;color:#1a1a1a;width:100%;outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#7F77DD}
.form-group textarea{resize:vertical;min-height:60px;font-family:inherit}
.check-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.check-item{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:1rem;padding-top:1rem;border-top:0.5px solid #eee}
.empty{text-align:center;padding:3rem 1rem;color:#aaa;font-size:14px}
.delete-btn{color:#A32D2D;border-color:#A32D2D}
.delete-btn:hover{background:#FCEBEB}
.img-section{margin-bottom:10px}
.img-section-label{font-size:12px;color:#666;margin-bottom:6px}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-bottom:8px}
.img-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#f5f5f0;border:0.5px solid #e5e5e5}
.img-thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.img-thumb-del{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.55);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px}
.img-thumb-del:hover{background:rgba(163,45,45,0.9)}
.img-thumb-main{position:absolute;bottom:3px;left:3px;font-size:10px;background:rgba(127,119,221,0.9);color:#fff;padding:1px 5px;border-radius:6px}
.img-add-btn{width:100%;height:40px;border:1px dashed #ccc;border-radius:8px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;color:#aaa;font-size:13px}
.img-add-btn:hover{border-color:#7F77DD;color:#7F77DD}
.lb-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:200;align-items:center;justify-content:center}
.lb-bg.open{display:flex}
.lb-img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:8px}
.lb-close{position:fixed;top:14px;right:18px;color:#fff;font-size:26px;cursor:pointer;background:none;border:none}
.lb-prev,.lb-next{position:fixed;top:50%;transform:translateY(-50%);color:#fff;font-size:28px;cursor:pointer;background:rgba(0,0,0,0.35);border:none;padding:10px 7px;border-radius:8px}
.lb-prev{left:10px}.lb-next{right:10px}
.lb-counter{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(0,0,0,0.4);padding:3px 12px;border-radius:12px}
.loading{text-align:center;padding:3rem;color:#aaa;font-size:14px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1><i class="ti ti-palette" style="font-size:18px;vertical-align:-2px;margin-right:6px;color:#7F77DD"></i>作品管理</h1>
  <button class="btn btn-primary" onclick="openAdd()"><i class="ti ti-plus"></i>作品を追加</button>
</header>
<main>
  <div class="toolbar">
    <input type="text" id="search" placeholder="タイトルで検索...">
    <select id="filter-status">
      <option value="">すべての状態</option>
      <option value="在庫あり">在庫あり</option>
      <option value="売り済み">売り済み</option>
      <option value="取り置き">取り置き</option>
    </select>
    <select id="filter-platform">
      <option value="">すべての販売先</option>
      <option value="BASE">BASE</option>
      <option value="minne">minne</option>
      <option value="展示">展示</option>
      <option value="未定">未定</option>
    </select>
  </div>
  <div class="stats" id="stats"></div>
  <div id="grid" class="grid"><div class="loading">読み込み中...</div></div>
</main>

<div class="modal-bg" id="modal-bg" onclick="closeModalBg(event)">
  <div class="modal">
    <h2 id="modal-title">作品を追加</h2>
    <div class="img-section">
      <div class="img-section-label">作品画像（複数枚OK）</div>
      <div class="img-grid" id="img-grid"></div>
      <input type="file" accept="image/*" multiple id="img-input" style="display:none" onchange="handleImgs(event)">
      <button class="img-add-btn" onclick="document.getElementById('img-input').click()" type="button">
        <i class="ti ti-photo-plus" style="font-size:16px"></i>画像を追加
      </button>
    </div>
    <div class="form-row">
      <div class="form-group"><label>タイトル *</label><input type="text" id="f-title" placeholder="作品タイトル"></div>
      <div class="form-group"><label>制作日</label><input type="date" id="f-date"></div>
    </div>
    <div class="form-row full">
      <div class="form-group"><label>説明・メモ</label><textarea id="f-desc" placeholder="素材、制作背景など"></textarea></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>価格 (円)</label><input type="number" id="f-price" placeholder="3000"></div>
      <div class="form-group"><label>在庫数</label><input type="number" id="f-stock" value="1"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>サイズ</label><input type="text" id="f-size" placeholder="A4 / 210×297mm"></div>
      <div class="form-group"><label>販売状況</label>
        <select id="f-status">
          <option value="在庫あり">在庫あり</option>
          <option value="売り済み">売り済み</option>
          <option value="取り置き">取り置き</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>販売先</label>
        <select id="f-platform">
          <option value="未定">未定</option>
          <option value="BASE">BASE</option>
          <option value="minne">minne</option>
          <option value="展示">展示</option>
        </select>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group"><label>投稿状況</label>
        <div class="check-group">
          <label class="check-item"><input type="checkbox" id="c-lp"> LP掲載済み</label>
          <label class="check-item"><input type="checkbox" id="c-insta"> Instagram投稿済み</label>
          <label class="check-item"><input type="checkbox" id="c-shop"> ショップ掲載済み</label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn delete-btn" id="delete-btn" style="display:none;margin-right:auto" onclick="deleteItem()"><i class="ti ti-trash"></i>削除</button>
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveItem()">保存</button>
    </div>
  </div>
</div>

<div class="lb-bg" id="lb-bg" onclick="closeLbBg(event)">
  <button class="lb-close" onclick="closeLb()"><i class="ti ti-x"></i></button>
  <button class="lb-prev" id="lb-prev" onclick="lbMove(-1)"><i class="ti ti-chevron-left"></i></button>
  <img class="lb-img" id="lb-img" src="" alt="">
  <button class="lb-next" id="lb-next" onclick="lbMove(1)"><i class="ti ti-chevron-right"></i></button>
  <div class="lb-counter" id="lb-counter"></div>
</div>

<script>
// ── IndexedDB ──────────────────────────────────
const DB_NAME='artwork_db';
const DB_VER=1;
let db=null;

function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('items'))d.createObjectStore('items',{keyPath:'id'});
      if(!d.objectStoreNames.contains('images'))d.createObjectStore('images',{keyPath:'id',autoIncrement:true});
    };
    req.onsuccess=e=>{db=e.target.result;res(db);};
    req.onerror=e=>rej(e);
  });
}

function dbGetAll(store){
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).getAll();
    req.onsuccess=()=>res(req.result);
    req.onerror=e=>rej(e);
  });
}

function dbPut(store,obj){
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readwrite');
    const req=tx.objectStore(store).put(obj);
    req.onsuccess=()=>res(req.result);
    req.onerror=e=>rej(e);
  });
}

function dbDelete(store,key){
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readwrite');
    const req=tx.objectStore(store).delete(key);
    req.onsuccess=()=>res();
    req.onerror=e=>rej(e);
  });
}

function dbGetByIndex(store,index,val){
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readonly');
    const s=tx.objectStore(store);
    // itemIdインデックスがなければgetAllでフィルタ
    const req=s.getAll();
    req.onsuccess=()=>res(req.result.filter(r=>r[index]===val));
    req.onerror=e=>rej(e);
  });
}

// ── State ──────────────────────────────────────
let items=[];      // メタデータ一覧（画像dataなし）
let editId=null;
let editImgs=[];   // [{id?(既存), data:base64, itemId}]
let lbImgs=[];
let lbIdx=0;

// ── Init ───────────────────────────────────────
async function init(){
  await openDB();
  items=await dbGetAll('items');
  render();
}

// ── Render ─────────────────────────────────────
function render(){renderStats();renderGrid();}

function renderStats(){
  const total=items.length;
  const inStock=items.filter(i=>i.status==='在庫あり').length;
  const sold=items.filter(i=>i.status==='売り済み').length;
  const val=items.filter(i=>i.status==='在庫あり').reduce((s,i)=>s+(i.price||0)*Math.max(i.stock||1,1),0);
  document.getElementById('stats').innerHTML=`
    <div class="stat-card"><div class="label">総作品数</div><div class="value">${total}</div></div>
    <div class="stat-card"><div class="label">在庫あり</div><div class="value">${inStock}</div></div>
    <div class="stat-card"><div class="label">売り済み</div><div class="value">${sold}</div></div>
    <div class="stat-card"><div class="label">在庫評価額</div><div class="value">¥${val.toLocaleString()}</div></div>`;
}

function filtered(){
  const q=document.getElementById('search').value.toLowerCase();
  const st=document.getElementById('filter-status').value;
  const pl=document.getElementById('filter-platform').value;
  return items.filter(i=>{
    if(q&&!i.title.toLowerCase().includes(q))return false;
    if(st&&i.status!==st)return false;
    if(pl&&i.platform!==pl)return false;
    return true;
  });
}

function renderGrid(){
  const list=filtered();
  const g=document.getElementById('grid');
  if(!list.length){
    g.innerHTML='<div class="empty"><i class="ti ti-mood-empty" style="font-size:32px;display:block;margin-bottom:8px"></i>作品がありません<br>「作品を追加」から登録してください</div>';
    return;
  }
  g.innerHTML=list.map(item=>{
    const sc=item.status==='売り済み'?'badge-sold':item.status==='取り置き'?'badge-hold':'badge-stock';
    const posts=[item.lp&&'LP',item.insta&&'Insta',item.shop&&'掲載'].filter(Boolean);
    const count=item.imgCount||0;
    const countTag=count>1?`<span class="card-img-count"><i class="ti ti-photo" style="font-size:10px"></i> ${count}</span>`:'';
    const thumbId='thumb-'+item.id;
    return `<div class="card" onclick="openDetail(${item.id})">
      <div class="card-img" id="${thumbId}"><i class="ti ti-photo" style="font-size:28px"></i><span>${count?'読込中...':'画像なし'}</span>${countTag}</div>
      <div class="card-body">
        <div class="card-title">${item.title}</div>
        <div class="card-sub">${item.date||''}${item.size?' · '+item.size:''}</div>
        <div class="badges">
          <span class="badge ${sc}">${item.status}</span>
          ${item.platform&&item.platform!=='未定'?`<span class="badge badge-platform">${item.platform}</span>`:''}
          ${posts.map(p=>`<span class="badge badge-sns">${p}済</span>`).join('')}
        </div>
        <div class="card-price">${item.price?'¥'+Number(item.price).toLocaleString():'価格未設定'}</div>
      </div></div>`;
  }).join('');
  // サムネイル非同期読み込み
  list.forEach(item=>{
    if(item.firstImgId){
      loadThumb(item.id,item.firstImgId);
    }
  });
}

async function loadThumb(itemId,imgId){
  try{
    const tx=db.transaction('images','readonly');
    const req=tx.objectStore('images').get(imgId);
    req.onsuccess=()=>{
      if(!req.result)return;
      const el=document.getElementById('thumb-'+itemId);
      if(el)el.innerHTML=`<img src="${req.result.data}" alt="">`;
    };
  }catch(e){}
}

document.getElementById('search').addEventListener('input',renderGrid);
document.getElementById('filter-status').addEventListener('change',renderGrid);
document.getElementById('filter-platform').addEventListener('change',renderGrid);

// ── 画像グリッド描画 ────────────────────────────
function renderImgGrid(){
  const g=document.getElementById('img-grid');
  g.innerHTML=editImgs.map((img,i)=>`
    <div class="img-thumb">
      <img src="${img.data}" alt="画像${i+1}" onclick="openLbEdit(${i})">
      ${i===0?'<span class="img-thumb-main">メイン</span>':''}
      <button class="img-thumb-del" onclick="removeImg(${i})"><i class="ti ti-x" style="font-size:11px"></i></button>
    </div>`).join('');
}

function handleImgs(e){
  const files=Array.from(e.target.files);
  let done=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      editImgs.push({data:ev.target.result,isNew:true});
      done++;
      if(done===files.length)renderImgGrid();
    };
    reader.readAsDataURL(file);
  });
  e.target.value='';
}

function removeImg(idx){
  editImgs.splice(idx,1);
  renderImgGrid();
}

// ── モーダル open/close ────────────────────────
function openAdd(){
  editId=null;editImgs=[];
  document.getElementById('modal-title').textContent='作品を追加';
  document.getElementById('delete-btn').style.display='none';
  resetForm();renderImgGrid();
  document.getElementById('modal-bg').classList.add('open');
}

async function openDetail(id){
  const item=items.find(i=>i.id===id);if(!item)return;
  editId=id;
  // 画像をDBから読み込む
  const allImgs=await dbGetByIndex('images','itemId',id);
  allImgs.sort((a,b)=>(a.order||0)-(b.order||0));
  editImgs=allImgs.map(img=>({id:img.id,data:img.data,isNew:false}));
  document.getElementById('modal-title').textContent='作品を編集';
  document.getElementById('delete-btn').style.display='inline-flex';
  document.getElementById('f-title').value=item.title||'';
  document.getElementById('f-date').value=item.date||'';
  document.getElementById('f-desc').value=item.desc||'';
  document.getElementById('f-price').value=item.price||'';
  document.getElementById('f-stock').value=item.stock!=null?item.stock:1;
  document.getElementById('f-size').value=item.size||'';
  document.getElementById('f-status').value=item.status||'在庫あり';
  document.getElementById('f-platform').value=item.platform||'未定';
  document.getElementById('c-lp').checked=!!item.lp;
  document.getElementById('c-insta').checked=!!item.insta;
  document.getElementById('c-shop').checked=!!item.shop;
  renderImgGrid();
  document.getElementById('modal-bg').classList.add('open');
}

function resetForm(){
  ['f-title','f-date','f-desc','f-price','f-size'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-stock').value=1;
  document.getElementById('f-status').value='在庫あり';
  document.getElementById('f-platform').value='未定';
  document.getElementById('c-lp').checked=false;
  document.getElementById('c-insta').checked=false;
  document.getElementById('c-shop').checked=false;
}

async function saveItem(){
  const title=document.getElementById('f-title').value.trim();
  if(!title){alert('タイトルを入力してください');return;}
  const btn=document.getElementById('save-btn');
  btn.disabled=true;btn.textContent='保存中...';

  const id=editId||Date.now();

  // 既存画像を一旦全削除してから保存し直す（順序管理を簡潔に）
  if(editId){
    const oldImgs=await dbGetByIndex('images','itemId',id);
    for(const img of oldImgs)await dbDelete('images',img.id);
  }

  // 画像を保存
  for(let i=0;i<editImgs.length;i++){
    await dbPut('images',{data:editImgs[i].data,itemId:id,order:i});
  }

  const meta={
    id,
    title,
    date:document.getElementById('f-date').value,
    desc:document.getElementById('f-desc').value,
    price:Number(document.getElementById('f-price').value)||0,
    stock:Number(document.getElementById('f-stock').value)||0,
    size:document.getElementById('f-size').value,
    status:document.getElementById('f-status').value,
    platform:document.getElementById('f-platform').value,
    lp:document.getElementById('c-lp').checked,
    insta:document.getElementById('c-insta').checked,
    shop:document.getElementById('c-shop').checked,
    imgCount:editImgs.length,
    firstImgId:null
  };

  // firstImgIdを取得
  if(editImgs.length>0){
    const saved=await dbGetByIndex('images','itemId',id);
    saved.sort((a,b)=>(a.order||0)-(b.order||0));
    meta.firstImgId=saved[0]?.id||null;
  }

  await dbPut('items',meta);
  if(editId){const idx=items.findIndex(i=>i.id===id);items[idx]=meta;}
  else{items.push(meta);}

  btn.disabled=false;btn.textContent='保存';
  closeModal();render();
}

async function deleteItem(){
  if(!confirm('この作品を削除しますか？'))return;
  const oldImgs=await dbGetByIndex('images','itemId',editId);
  for(const img of oldImgs)await dbDelete('images',img.id);
  await dbDelete('items',editId);
  items=items.filter(i=>i.id!==editId);
  closeModal();render();
}

function closeModal(){document.getElementById('modal-bg').classList.remove('open');}
function closeModalBg(e){if(e.target===document.getElementById('modal-bg'))closeModal();}

// ── ライトボックス ─────────────────────────────
function openLbEdit(idx){
  lbImgs=editImgs.map(i=>i.data);
  lbIdx=idx;updateLb();
  document.getElementById('lb-bg').classList.add('open');
}
function updateLb(){
  document.getElementById('lb-img').src=lbImgs[lbIdx];
  document.getElementById('lb-counter').textContent=`${lbIdx+1} / ${lbImgs.length}`;
  document.getElementById('lb-prev').style.display=lbImgs.length>1?'flex':'none';
  document.getElementById('lb-next').style.display=lbImgs.length>1?'flex':'none';
}
function lbMove(dir){lbIdx=(lbIdx+dir+lbImgs.length)%lbImgs.length;updateLb();}
function closeLb(){document.getElementById('lb-bg').classList.remove('open');}
function closeLbBg(e){if(e.target===document.getElementById('lb-bg'))closeLb();}

init();
</script>
</body>
